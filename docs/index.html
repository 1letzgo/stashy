<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stashy — Stash for iOS</title>
  <meta name="description" content="A native Stash client for iOS. Fast, private, connected to your server.">
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    :root {
      --bg: #1E293B;
      --card: #334155;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.55);
      --line: rgba(255, 255, 255, 0.10);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 48px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .lead {
      color: var(--muted);
      margin: 10px 0 32px;
      max-width: 28em;
      margin-left: auto;
      margin-right: auto;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 56px;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 560;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
    }

    a.btn.primary {
      background: #fff;
      color: #1E293B;
      border-color: transparent;
    }

    .shots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 56px;
    }

    .shots img {
      width: 168px;
      height: auto;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    footer {
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <img class="logo" src="icon.png" alt="stashy">
  <h1>stashy</h1>
  <p class="lead">Native Stash client for iPhone. Fast, no tracking, wired to your server.</p>

  <div class="actions">
    <a class="btn primary" href="https://apps.apple.com/us/app/stashy/id6754876029">App Store</a>
    <a class="btn" href="https://discord.gg/DMxEFaVzUM">Discord</a>
    <a class="btn" href="https://github.com/1letzgo/stashy">GitHub</a>
  </div>

  <div class="shots">
    <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/f9/87/42/f9874279-3c17-32b6-90a9-243bfb431a59/1.png/600x0w.jpg" alt="stashy dashboard">
    <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/64/e9/1f/64e91f79-591d-7e74-e0fe-d2bf74248c8e/2.png/600x0w.jpg" alt="stashy scene view">
    <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/c7/d6/cd/c7d6cdbc-728e-46b8-19be-379f7d03bcc4/Dein_Abschnittstext-2.png/600x0w.jpg" alt="stashy performer view">
  </div>

  <footer>
    <a href="mailto:stashy@letzgo.me">stashy@letzgo.me</a>
    · no analytics, no tracking
  </footer>
</body>
</html>
