<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stashy — Stash for iOS</title>
  <meta name="description" content="A native Stash client for iOS. Fast, private, connected to your server.">
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    :root {
      --bg: #1E293B;
      --card: #334155;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.55);
      --line: rgba(255, 255, 255, 0.10);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 48px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .lead {
      color: var(--muted);
      margin: 10px 0 32px;
      max-width: 28em;
      margin-left: auto;
      margin-right: auto;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 56px;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 560;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
    }

    a.btn.primary {
      background: #fff;
      color: #1E293B;
      border-color: transparent;
    }

    .shots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 56px;
    }

    .phone {
      width: 168px;
      aspect-ratio: 9 / 19.5;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--line);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .phone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: none;
    }

    .phone.has-image img { display: block; }
    .phone.has-image .ph { display: none; }

    .ph {
      color: var(--muted);
      font-size: 13px;
      padding: 0 12px;
    }

    footer {
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <img class="logo" src="icon.png" alt="stashy">
  <h1>stashy</h1>
  <p class="lead">Native Stash client for iPhone. Fast, no tracking, wired to your server.</p>

  <div class="actions">
    <a class="btn primary" href="https://apps.apple.com/us/app/stashy/id6754876029">App Store</a>
    <a class="btn" href="https://discord.gg/DMxEFaVzUM">Discord</a>
  </div>

  <div class="shots">
    <div class="phone">
      <img src="screenshots/1.png" alt="stashy screenshot">
      <span class="ph">iOS Screenshot</span>
    </div>
    <div class="phone">
      <img src="screenshots/2.png" alt="stashy screenshot">
      <span class="ph">iOS Screenshot</span>
    </div>
    <div class="phone">
      <img src="screenshots/3.png" alt="stashy screenshot">
      <span class="ph">iOS Screenshot</span>
    </div>
  </div>

  <footer>
    <a href="https://github.com/1letzgo/stashy">GitHub</a>
    · no analytics, no tracking
  </footer>

  <script>
    document.querySelectorAll(".phone img").forEach(function (img) {
      img.addEventListener("load", function () {
        img.parentElement.classList.add("has-image");
      });
    });
  </script>
</body>
</html>
