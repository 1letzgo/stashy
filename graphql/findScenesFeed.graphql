# findScenes for the Feeds › Scenes mode: the list fields plus each scene's marker times
# (start position "First Marker"). Aliased so the partial list never passes for the
# scene's real `scene_markers`.
query FindScenesFeed($scene_filter: SceneFilterType, $filter: FindFilterType) {
  findScenes(scene_filter: $scene_filter, filter: $filter) {
    count
    scenes {
      ...SceneListFields
      feed_marker_seconds: scene_markers { seconds }
    }
  }
}
