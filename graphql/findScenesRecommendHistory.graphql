# For You (stashy+): watched scenes of the look-back window with their play and O stamps.
# Eigene Query, damit `play_history` / `o_history` nicht in die geteilten Fragmente wandern —
# ältere Server ohne diese Felder bekommen die Fallback-Query ohne sie.
query FindScenesRecommendHistory($scene_filter: SceneFilterType, $filter: FindFilterType) {
  findScenes(scene_filter: $scene_filter, filter: $filter) {
    count
    scenes {
      ...SceneListFields
      tags { id name scene_count }
      play_history
      o_history
    }
  }
}
