# For You (stashy+): candidate scenes, with tag scene counts for the rarity weighting.
query FindScenesRecommendCandidates($scene_filter: SceneFilterType, $filter: FindFilterType) {
  findScenes(scene_filter: $scene_filter, filter: $filter) {
    count
    scenes {
      ...SceneListFields
      tags { id name scene_count }
    }
  }
}
