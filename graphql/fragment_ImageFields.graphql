fragment ImageFields on Image {
  id title rating100 organized o_counter date created_at updated_at
  paths { thumbnail preview image }
  visual_files {
    ... on BaseFile { __typename path }
    ... on ImageFile { __typename path height width }
    ... on VideoFile { __typename path height width duration }
  }
  galleries { id title }
  performers { id name image_path }
  studio { id name }
  tags { id name }
}
